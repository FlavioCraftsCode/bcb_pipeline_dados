name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python — lint, testes unitários e de integração
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: securepassword
          POSTGRES_DB: bcb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d bcb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TESTE: postgresql+psycopg2://admin:securepassword@localhost:5432/bcb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Testes (unitários + integração com PostgreSQL)
        run: pytest --cov=bcb_pipeline --cov-report=term-missing

  frontend:
    name: Front-end — typecheck e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
