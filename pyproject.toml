[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bcb-pipeline-dados"
version = "2.0.0"
description = "Pipeline de dados, Data Warehouse e painel analítico de indicadores do Banco Central do Brasil"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
bcb-pipeline = "bcb_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["integracao: exige PostgreSQL (DATABASE_URL_TESTE)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "NPY"]
ignore = ["B008", "SIM108", "PD011", "PD008", "PD010"]

[tool.ruff.lint.isort]
known-first-party = ["bcb_pipeline", "bcb_api", "conftest"]
